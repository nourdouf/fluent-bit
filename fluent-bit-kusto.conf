[SERVICE]
    # Flush logs every 5 seconds
    Flush        5
    # Set the logging level (error, warning, info, debug, trace)
    Log_Level    info
    # Disable daemon mode (run in foreground)
    Daemon       off

[INPUT]
    # This should only go to FluentBitTesting
    Name         dummy
    Tag          test.logs
    # Generate 1 log per second
    Rate         100
    # Sample log message with table_name field
    Dummy        {"message": "Customer Obsessed", "level": "info",}

[INPUT]
    # This should only go to FluentBitTesting2
    Name         dummy
    Tag          test.logs2
    # Generate 1 log per second
    Rate         100
    # Sample log message with different table_name
    Dummy        {"message": "Diverse & Inclusive", "level": "warning", "table_name": "FluentBitTesting2"}

[INPUT]
    # This should only go to FluentBitTesting3
    Name         dummy
    Tag          test.logs3
    # Generate 1 log per second
    Rate         100
    # Sample log message with different table_name
    Dummy        {"message": "Own the Outcome", "level": "warning", "table_name": "FluentBitTesting3"}

[OUTPUT]
    Name                azure_kusto
    Match               *
    
    # Required: Your Kusto cluster ingestion endpoint
    # Format: https://<cluster-name>.ingest-<region>.kusto.windows.net
    ingestion_endpoint  https://ingest-octokus-glb-1.centralus.kusto.windows.net
    
    # Required: Database and table
    database_name       glb
    table_name          FluentBitTesting
    
    # Authentication - Choose ONE method:
    
    # Option 1: Service Principal (App Registration)
    tenant_id           398a6654-997b-47e9-b12b-9515b896b4de
    client_id           d99544d6-588a-4d7a-a6c4-ad326cfb7649
    client_secret       bMvx3E9LsKk9AGdk.4h6Jd7np.CXzId0ry
    
    # Optional: Include timestamp and tag in the output
    time_key            timestamp
    include_time_key    On
    tag_key             tag
    include_tag_key     On
    
    # Optional: Compression (enabled by default)
    compression_enabled On
    
    # Upload settings (for faster testing - upload every 10 seconds or 100KB)
    upload_timeout      10s
    upload_file_size    10M
